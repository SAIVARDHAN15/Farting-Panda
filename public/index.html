<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farting Panda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-over-overlay" class="hidden">
        <div class="menu-box">
            <h1>Game Over</h1>
            <p style="color: white; font-size: 20px; margin-bottom: 10px;">Score: <span id="go-score">0</span></p>
            <p style="color: #FFD700; font-size: 18px; margin-bottom: 20px;">High Score: <span id="go-high-score">0</span></p>
            <button id="btn-restart" class="btn primary">Restart</button>
        </div>
    </div>
    <div id="menu-overlay">
        <div class="menu-box"> 

            <h1></h1>
            <input type="text" id="username" placeholder="Panda name" maxlength="12" autocomplete="off">
            
            <div class="button-group">
                <button id="btn-offline" class="btn secondary">Single Player</button>
                <button id="btn-online" class="btn primary">Multi Player</button>
            </div>
            
            <p id="status-msg">Ready to fly.</p>
        </div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
